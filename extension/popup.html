<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Starter Extension</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 280px;
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 13px; line-height: 1.5; color: #64748b; margin: 0 0 16px; }
    button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15); }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <h1>Minimal Starter</h1>
  <p>Thanks for installing the extension.</p>
  <button id="action">Say hello</button>
  <script src="popup.js"></script>
</body>
</html>
